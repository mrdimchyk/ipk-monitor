name: IPK daily collector

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run VOBU scraper
        run: python scraper.py --max-pages 5 --overlap-days 7

      - name: Save SQLite state
        run: |
          git config user.name "IPK Bot"
          git config user.email "ipk-bot@users.noreply.github.com"
          git add ipk.sqlite3
          git diff --cached --quiet || git commit -m "Update IPK database"
          git push
