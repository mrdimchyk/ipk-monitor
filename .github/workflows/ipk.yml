name: IPK daily collector

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run VOBU scraper bounded collection
        run: python scraper.py --max-pages 2 --overlap-days 7 --max-new-details 50
      - name: Show collected state
        run: |
          python - <<'PY'
          import sqlite3
          db = sqlite3.connect('ipk.sqlite3')
          rows = db.execute('select ipk_date, number, source_url from ipk order by ipk_date desc, id desc limit 15').fetchall()
          print('DB rows:', db.execute('select count(*) from ipk').fetchone()[0])
          for row in rows:
              print(row)
          PY
      - name: Save SQLite state
        run: |
          git config user.name "IPK Bot"
          git config user.email "ipk-bot@users.noreply.github.com"
          git add ipk.sqlite3
          git diff --cached --quiet || git commit -m "Update IPK database"
          git push
