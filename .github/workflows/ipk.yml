name: IPK daily collector

on:
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send test email"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect new IPKs and send digest
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ "${{ inputs.test_email }}" = "true" ]; then
            python scraper.py --max-pages 2 --overlap-days 7 --max-new-details 50 --test-email
          else
            python scraper.py --max-pages 2 --overlap-days 7 --max-new-details 50 --send-email
          fi
      - name: Show collected state
        run: |
          python - <<'PY'
          import sqlite3
          db = sqlite3.connect('ipk.sqlite3')
          rows = db.execute('select ipk_date, number, source_url from ipk order by ipk_date desc, id desc limit 15').fetchall()
          print('DB rows:', db.execute('select count(*) from ipk').fetchone()[0])
          for row in rows:
              print(row)
          PY
      - name: Save SQLite state
        run: |
          git config user.name "IPK Bot"
          git config user.email "ipk-bot@users.noreply.github.com"
          git add ipk.sqlite3
          git diff --cached --quiet || git commit -m "Update IPK database"
          git push
